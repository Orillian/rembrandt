# Checks every push and pull request: JavaScript syntax and imports, the installer script, and the
# server (build and tests). The desktop apps are built by release.yml.
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm run check
      - run: bash -n install.sh && shellcheck -S warning install.sh
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo test --manifest-path server/Cargo.toml
      - run: cargo build --release --manifest-path server/Cargo.toml
