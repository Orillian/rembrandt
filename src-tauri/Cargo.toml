[package]
name = "lumen"
version = "0.3.27"
description = "Rembrandt photo editor"
authors = ["Rembrandt contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = { version = "1", features = ["parallel"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 2.6.2 doesn't compile on Linux (it builds ini::ParseOption without the fields rust-ini 0.21.3 added).
tauri-plugin-deep-link = ">=2, <2.6.2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
jpeg-decoder = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"

# The system web view on Linux: its graphics acceleration is set explicitly (see lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
